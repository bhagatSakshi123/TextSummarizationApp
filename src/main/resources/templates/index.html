<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Text Summarizer</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-5">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            AI Summarizer
        </a>

        <div>
            <a href="/new" class="btn btn-outline-light me-2">
                New Summary
            </a>

            <a href="/history" class="btn btn-light">
                History
            </a>
        </div>

    </div>
</nav>

<div class="container py-5">

    <!-- Heading -->
    <div class="text-center mb-5">

        <h1 class="fw-bold">
            AI Text Summarizer
        </h1>

        <p class="text-muted">
            Generate an abstractive summary using AI
        </p>

    </div>


    <!-- Main Card -->
    <div class="card shadow-lg border-0">

        <div class="card-body p-4">

            <div th:if="${error}"
                 class="alert alert-danger"
                 role="alert">

                <span th:text="${error}"></span>

            </div>

            <form action="/summarize" method="post">

                <!-- Input -->
                <div class="mb-4">

                    <label for="text" class="form-label fw-semibold">
                        Enter your text
                    </label>

                    <textarea
                            id="text"
                            name="text"
                            class="form-control"
                            rows="12"
                            placeholder="Paste your article or text here..."
                            required></textarea>

                    <div class="d-flex justify-content-between mt-2">

                        <small class="text-muted">
                            Minimum 200 characters
                        </small>

                        <small class="text-muted">
                            Characters: <span id="charCount">0</span>
                            |
                            Words: <span id="wordCount">0</span>
                        </small>

                    </div>


                    <div class="form-text">
                        Enter at least 200 characters.
                    </div>

                </div>


                <!-- Button -->
                <div class="text-center">

                    <button
                            type="submit"
                            class="btn btn-primary btn-lg px-5">

                        Summarize

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

    const textArea = document.getElementById("text");
    const charCount = document.getElementById("charCount");
    const wordCount = document.getElementById("wordCount");

    textArea.addEventListener("input", function () {

        const text = textArea.value;

        // Character count
        charCount.textContent = text.length;

        // Word count
        const words = text.trim() === ""
                ? 0
                : text.trim().split(/\s+/).length;

        wordCount.textContent = words;
    });

</script>

</body>

</html>
