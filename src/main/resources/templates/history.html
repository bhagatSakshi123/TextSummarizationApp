<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summary History</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-5">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            AI Summarizer
        </a>

        <div>
            <a href="/new" class="btn btn-outline-light me-2">
                New Summary
            </a>

            <a href="/history" class="btn btn-light">
                History
            </a>
        </div>

    </div>
</nav>

<div class="container py-5">

    <!-- Heading -->
    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Summary History
        </h1>

        <p class="text-muted">
            Your previously generated summaries
        </p>

    </div>


    <!-- No summaries -->
    <div th:if="${#lists.isEmpty(summaries)}"
         class="alert alert-info text-center">

        No summaries found.

    </div>


    <!-- Summaries -->
    <div th:each="summary : ${summaries}"
         class="card shadow-sm border-0 mb-4">

        <div class="card-body p-4">

            <!-- Date -->
            <div class="text-muted small mb-3">

                Created:
                <span th:text="${summary.createdAt}"></span>

            </div>


            <!-- Original Text -->
            <h5 class="fw-bold">
                Original Text
            </h5>

            <p class="mb-4"
               th:text="${summary.originalText}">
            </p>


            <!-- Generated Summary -->
            <h5 class="fw-bold">
                AI Generated Summary
            </h5>

            <div class="mt-3">

                <a th:href="@{/history/delete/{id}(id=${summary.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this summary?');">

                    Delete

                </a>

            </div>

            <div class="summary-box">

                <p class="mb-0"
                   th:text="${summary.generatedSummary}">
                </p>

            </div>

        </div>

    </div>


    <!-- Back Button -->
    <div class="text-center mt-4">

        <a href="/" class="btn btn-primary px-4">
            Create New Summary
        </a>

    </div>

</div>

</body>

</html>
